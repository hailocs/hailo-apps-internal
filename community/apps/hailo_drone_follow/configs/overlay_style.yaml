# hailooverlay_community per-class style overrides for drone-follow.
#
# Used by the local (display / record) branch — see
# `drone_follow/pipeline_adapter/vision_branches.py:local_branch`.
#
# Class 99 is reserved for the locked / auto-tracked target. The
# `highlight_target` pad probe replaces the target's HailoDetection with
# a copy carrying class_id=99, which makes the rule below apply.
#
# All other detections (class_id 0 = person, plus any other classes the
# detector emits) inherit the element-level defaults — thin line, default
# palette colour — so they stay visible but unobtrusive.

styles:
  99:
    color: [0, 255, 0]      # green — locked target
    line_thickness: 6      # ~6x the element-level default (2)
    show_label: true
