      default_h8: yolov8m
      default_h8l: yolov8s
      default_h10h: yolov8m
      postprocess: none
  pipeline_pattern: null
  features: [async_inference, cpu_postprocess, opencv_visualization, fps_monitor]
  input_types: [images, file, camera]
  hardware: [hailo8, hailo8l, hailo10h]
  use_cases:
